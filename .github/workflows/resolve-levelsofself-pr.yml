name: Resolve Levels Of Self Listing

on:
  push:
    branches:
      - add-levelsofself

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out contribution branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: add-levelsofself
          fetch-depth: 1
          persist-credentials: true
          submodules: false
      - name: Insert one current listing
        shell: bash --noprofile --norc -Eeuo pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          assert "api.100levelup.com" not in text
          anchor = "- [Darrylbots x402 Research](https://tryponcho.com/m/darrylbots.com)"
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(anchor)]
          assert len(matches) == 1, matches
          listing = "- [Levels Of Self Governance API](https://api.100levelup.com/.well-known/x402) - Seven x402 v2 governance resources for AI agents on Base mainnet with USDC: deterministic MCP-config governance lint (`POST /x402/audit-mcp`, $0.05), audit-chain verification (`GET /x402/verify-audit`, $0.005), legal-prep, bookkeeping, agent-therapy, and two paid playbooks. No signup or API keys. ([Agent Card](https://api.100levelup.com/.well-known/agent.json)) ([OpenAPI](https://api.100levelup.com/openapi.json)) ([llms.txt](https://api.100levelup.com/llms.txt)) ([Free scan](https://api.100levelup.com/scan))"
          lines.insert(matches[0] + 1, listing)
          rendered = "\n".join(lines) + "\n"
          assert rendered.count("api.100levelup.com/.well-known/x402") == 1
          path.write_text(rendered, encoding="utf-8")
          PY
          rm .github/workflows/resolve-levelsofself-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/resolve-levelsofself-pr.yml
          git diff --cached --check
          git commit -m 'Add Levels Of Self governance API'
          git push origin HEAD:add-levelsofself
